<title>CHIEF 心智圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: a field-map table — one sticky command bar, a tree of orders below, a message pad to Claude on the right. */
  :root {
    --bg: #eef0e6; --panel: #f9faf4; --fg: #1f2419; --muted: #676b5c; --line: #cfd3c0;
    --accent: #3f6b3a; --accent-ink: #ffffff; --warn: #b8720f; --danger: #a33a2e; --chip: #e3e7d6;
    --font: -apple-system, "PingFang TC", "PingFang SC", "Noto Sans TC", "Noto Sans SC", "Microsoft JhengHei", "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #15170f; --panel: #1e2118; --fg: #e4e7d9; --muted: #9ea293; --line: #3a3f31;
    --accent: #8fc07a; --accent-ink: #0f140b; --warn: #e2a24a; --danger: #e4756a; --chip: #2a2e22; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #15170f; --panel: #1e2118; --fg: #e4e7d9; --muted: #9ea293; --line: #3a3f31;
    --accent: #8fc07a; --accent-ink: #0f140b; --warn: #e2a24a; --danger: #e4756a; --chip: #2a2e22; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; max-width: 1240px; margin: 0 auto; }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); margin: 0 -16px; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .01em; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; font-variant-numeric: tabular-nums; font-size: 12px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; }
  .save { font-size: 12px; color: var(--muted); min-width: 7em; }
  .save.dirty { color: var(--warn); } .save.err { color: var(--danger); }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); } button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--danger); } button.small { padding: 2px 7px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], textarea, select { font: inherit; font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%; box-sizing: border-box; }
  input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; margin-top: 16px; }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } aside { order: -1; } }
  aside { display: flex; flex-direction: column; gap: 14px; }
  .pad { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .pad h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
  .pad p { margin: 6px 0; font-size: 13px; color: var(--muted); }
  .pad textarea { min-height: 140px; resize: vertical; }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
  .search { margin-bottom: 10px; }
  ul.tree, ul.tree ul { list-style: none; margin: 0; padding: 0; }
  ul.tree > li { margin-bottom: 14px; }
  ul.tree ul { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 10px; }
  li.hidden-by-search { display: none; }
  .row { display: flex; align-items: flex-start; gap: 6px; padding: 3px 4px; border-radius: 6px; min-width: 0; }
  .row:hover { background: var(--panel); }
  .row.top > .text { font-weight: 600; font-size: 16px; }
  .caret { width: 20px; height: 24px; flex: none; border: 0; background: none; color: var(--muted); padding: 0; font-size: 12px; }
  .caret.leaf { visibility: hidden; }
  .status { flex: none; width: 28px; height: 24px; padding: 0; border: 0; background: none; font-size: 15px; line-height: 24px; text-align: center; overflow: hidden; }
  .status.empty i { display: inline-block; width: 11px; height: 11px; border: 1.5px solid var(--line); border-radius: 50%; vertical-align: middle; }
  .status.empty:hover i { border-color: var(--accent); }
  .text { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
  .text .link { font-family: var(--mono); font-size: 11px; background: var(--chip); border-radius: 4px; padding: 1px 5px; margin-left: 6px; color: var(--muted); white-space: nowrap; }
  .text .note { display: block; font-size: 13px; color: var(--muted); border-left: 3px solid var(--warn); padding-left: 8px; margin-top: 3px; white-space: pre-wrap; }
  .more { flex: none; opacity: .35; } .row:hover .more, .row:focus-within .more { opacity: 1; }
  .form { background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin: 4px 0 8px 30px; display: grid; gap: 8px; }
  .form label { font-size: 12px; color: var(--muted); display: grid; gap: 3px; }
  .form .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .form .actions .spacer { flex: 1; }
  .empty { padding: 40px 10px; color: var(--muted); text-align: center; }
  .banner { background: var(--chip); border-radius: 6px; padding: 6px 10px; font-size: 13px; margin-top: 10px; }
  @media (prefers-reduced-motion: no-preference) { .row { transition: background .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>CHIEF 心智圖 <small id="meta">AI 參謀長 RTS</small></h1>
    <div class="chips" id="chips"></div>
    <span class="save" id="save">載入中…</span>
    <div class="tools">
      <button id="expandAll" class="small">展開全部</button>
      <button id="collapseAll" class="small">收合全部</button>
      <button id="copyMd" class="small">複製 Markdown</button>
      <button id="addTop" class="small primary">＋ 主節點</button>
    </div>
  </header>

  <main>
    <section>
      <div class="search"><input type="text" id="search" placeholder="搜尋節點…" aria-label="搜尋節點"></div>
      <div id="treeHost"><div class="empty" id="emptyMsg">正在載入心智圖…</div></div>
    </section>
    <aside>
      <div class="pad">
        <h2>給 Claude 的指示</h2>
        <p>改完圖之後，想補充的話寫在這裡。Claude 下次「照心智圖做」會先讀這段。</p>
        <textarea id="instructions" placeholder="例如：M0 先用 Python，不要碰引擎。D1 我選 Godot。"></textarea>
      </div>
      <div class="pad">
        <h2>怎麼用</h2>
        <div class="legend">
          <span>⬜</span><span>未開始</span>
          <span>🟡</span><span>進行中：叫 Claude 這次做</span>
          <span>✅</span><span>完成</span>
          <span>❌</span><span>作廢／本版不做</span>
          <span>❓</span><span>等老闆決策</span>
        </div>
        <p>點狀態符號可循環切換。點文字直接改。點「⋯」可加子節點、加備註、搬動、刪除。</p>
        <p>每次修改會自動儲存。改完告訴 Claude：「照心智圖做」。</p>
      </div>
      <div class="pad">
        <h2>同步資訊</h2>
        <p id="syncInfo">—</p>
        <p>Markdown 鏡像：<code>ai-commander-game/MINDMAP.md</code></p>
      </div>
    </aside>
  </main>
</div>

<script>
(() => {
  const STATUS = ["", "todo", "doing", "done", "dropped", "decide"];
  const EMOJI = { todo: "⬜", doing: "🟡", done: "✅", dropped: "❌", decide: "❓" };
  const LABEL = { todo: "未開始", doing: "進行中", done: "完成", dropped: "作廢", decide: "待決策" };
  const DOC_PATH = "mindmap/main";

  let tree = null;          // {title, nodes, version, updatedAt, updatedBy, instructions}
  let db = null, docRef = null;
  let canWrite = true;      // null/true keep inputs; false → read-only
  let dirty = false, saving = false, saveTimer = null, lastSavedAt = "";
  let openForm = null;      // node id whose edit form is open
  let confirmDelete = null; // node id awaiting delete confirmation
  let query = "";
  const collapsed = loadCollapsed();

  const $ = (id) => document.getElementById(id);
  const host = $("treeHost"), saveEl = $("save");

  // ---------- helpers ----------
  function uid() { return "n_" + Math.random().toString(36).slice(2, 10); }
  function loadCollapsed() { try { return new Set(JSON.parse(localStorage.getItem("chief.collapsed") || "[]")); } catch { return new Set(); } }
  function storeCollapsed() { try { localStorage.setItem("chief.collapsed", JSON.stringify([...collapsed])); } catch {} }
  function walk(nodes, fn, parent = null) { for (const n of nodes) { fn(n, parent, nodes); walk(n.children || [], fn, n); } }
  function find(id) { let hit = null; walk(tree.nodes, (n, p, arr) => { if (n.id === id) hit = { n, p, arr }; }); return hit; }
  function counts() {
    const c = { todo: 0, doing: 0, done: 0, dropped: 0, decide: 0 };
    tree.nodes.slice(1).forEach(top => walk([top], n => { if (c[n.status] !== undefined) c[n.status]++; }));
    return c;
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch])); }
  function matches(n) { if (!query) return true; const q = query.toLowerCase(); return (n.text + " " + (n.note || "") + " " + (n.link || "")).toLowerCase().includes(q); }
  function subtreeMatches(n) { return matches(n) || (n.children || []).some(subtreeMatches); }

  // ---------- markdown export (same canonical form as tools/sync_mindmap.py) ----------
  function nodeLine(n) {
    let s = n.text.trim();
    if (n.status && EMOJI[n.status]) s += " " + EMOJI[n.status];
    if (n.link) s += " → " + n.link;
    return s;
  }
  function toMarkdown() {
    const out = ["---", "title: AI 參謀長 RTS 心智圖", "markmap:", "  colorFreezeLevel: 2", "  initialExpandLevel: 2", "  maxWidth: 360", "---", "", "# " + tree.title, ""];
    const child = (n, lvl) => {
      const pad = "  ".repeat(lvl);
      out.push(pad + "- " + nodeLine(n));
      if (n.note) n.note.split("\n").forEach(l => out.push(pad + "  - 💬 " + l));
      (n.children || []).forEach(c => child(c, lvl + 1));
    };
    for (const top of tree.nodes) {
      out.push("## " + nodeLine(top));
      if (top.note) top.note.split("\n").forEach(l => out.push("- 💬 " + l));
      (top.children || []).forEach(c => child(c, 0));
      out.push("");
    }
    return out.join("\n").trimEnd() + "\n";
  }

  // ---------- render ----------
  function render() {
    if (!tree) return;
    const c = counts();
    $("chips").innerHTML = Object.keys(EMOJI).map(k => `<span class="chip">${EMOJI[k]} ${c[k]}</span>`).join("");
    $("meta").textContent = tree.title || "";
    $("syncInfo").textContent = tree.updatedAt ? `最後更新：${tree.updatedAt.replace("T", " ").replace("Z", " UTC")}（${tree.updatedBy === "claude" ? "Claude" : "老闆"}）・版本 ${tree.version || 0}` : "尚未同步";
    if (document.activeElement !== $("instructions")) $("instructions").value = tree.instructions || "";

    const ul = document.createElement("ul"); ul.className = "tree";
    tree.nodes.forEach(n => ul.appendChild(renderNode(n, true)));
    host.replaceChildren(ul);
    if (!tree.nodes.length) host.innerHTML = '<div class="empty">還沒有節點。按右上角「＋ 主節點」開始。</div>';
  }

  function renderNode(n, top) {
    const li = document.createElement("li");
    if (query && !subtreeMatches(n)) li.className = "hidden-by-search";
    const hasKids = (n.children || []).length > 0;
    const isCollapsed = collapsed.has(n.id) && !query;
    const row = document.createElement("div"); row.className = "row" + (top ? " top" : "");
    row.innerHTML = `
      <button class="caret${hasKids ? "" : " leaf"}" aria-label="${isCollapsed ? "展開" : "收合"}">${isCollapsed ? "▶" : "▼"}</button>
      <button class="status${n.status ? "" : " empty"}" title="切換狀態">${n.status ? EMOJI[n.status] : "<i></i>"}</button>
      <div class="text"><span class="label" contenteditable="${canWrite === false ? "false" : "plaintext-only"}" spellcheck="false">${escapeHtml(n.text)}</span>${n.link ? `<span class="link">→ ${escapeHtml(n.link)}</span>` : ""}${n.note ? `<span class="note">💬 ${escapeHtml(n.note)}</span>` : ""}</div>
      <button class="more small" title="更多">⋯</button>`;
    row.querySelector(".caret").onclick = () => { if (!hasKids) return; collapsed.has(n.id) ? collapsed.delete(n.id) : collapsed.add(n.id); storeCollapsed(); render(); };
    row.querySelector(".status").onclick = () => { if (canWrite === false) return; n.status = STATUS[(STATUS.indexOf(n.status || "") + 1) % STATUS.length]; markDirty(); render(); };
    const label = row.querySelector(".label");
    label.onblur = () => { const v = label.textContent.trim(); if (v && v !== n.text) { n.text = v; markDirty(); render(); } else label.textContent = n.text; };
    label.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); label.blur(); } if (e.key === "Escape") { label.textContent = n.text; label.blur(); } };
    row.querySelector(".more").onclick = () => { openForm = openForm === n.id ? null : n.id; confirmDelete = null; render(); };
    li.appendChild(row);
    if (openForm === n.id) li.appendChild(renderForm(n, top));
    if (hasKids && !isCollapsed) {
      const ul = document.createElement("ul");
      n.children.forEach(ch => ul.appendChild(renderNode(ch, false)));
      li.appendChild(ul);
    }
    return li;
  }

  function renderForm(n, top) {
    const f = document.createElement("div"); f.className = "form";
    const ro = canWrite === false;
    f.innerHTML = `
      <label>狀態<select id="f-status" ${ro ? "disabled" : ""}>${STATUS.map(s => `<option value="${s}" ${s === (n.status || "") ? "selected" : ""}>${s ? EMOJI[s] + " " + LABEL[s] : "（無）"}</option>`).join("")}</select></label>
      <label>連結（docs/… 檔案路徑）<input type="text" id="f-link" value="${escapeHtml(n.link || "")}" placeholder="docs/03-architecture.md" ${ro ? "disabled" : ""}></label>
      <label>備註（寫給 Claude 的話）<textarea id="f-note" rows="3" ${ro ? "disabled" : ""}>${escapeHtml(n.note || "")}</textarea></label>
      <div class="actions">
        <button id="f-child" ${ro ? "disabled" : ""}>＋ 子節點</button>
        <button id="f-sibling" ${ro ? "disabled" : ""}>＋ 同層節點</button>
        <button id="f-up" ${ro ? "disabled" : ""}>上移</button>
        <button id="f-down" ${ro ? "disabled" : ""}>下移</button>
        ${!top ? `<button id="f-outdent" ${ro ? "disabled" : ""}>升一層</button>` : ""}
        <span class="spacer"></span>
        <button id="f-del" class="danger" ${ro ? "disabled" : ""}>${confirmDelete === n.id ? "確定刪除（含子節點）" : "刪除"}</button>
        <button id="f-close">關閉</button>
      </div>`;
    const commit = () => {
      n.status = f.querySelector("#f-status").value;
      n.link = f.querySelector("#f-link").value.trim();
      n.note = f.querySelector("#f-note").value.trim();
      markDirty();
    };
    f.querySelector("#f-status").onchange = () => { commit(); render(); };
    f.querySelector("#f-link").onchange = () => { commit(); render(); };
    f.querySelector("#f-note").onchange = () => { commit(); render(); };
    f.querySelector("#f-child").onclick = () => { commit(); const c = blank(); (n.children ||= []).push(c); collapsed.delete(n.id); openForm = c.id; markDirty(); render(); focusLabel(c.id); };
    f.querySelector("#f-sibling").onclick = () => { commit(); const { arr } = find(n.id); const c = blank(); arr.splice(arr.indexOf(n) + 1, 0, c); openForm = c.id; markDirty(); render(); focusLabel(c.id); };
    f.querySelector("#f-up").onclick = () => { commit(); const { arr } = find(n.id); const i = arr.indexOf(n); if (i > 0) { arr.splice(i, 1); arr.splice(i - 1, 0, n); markDirty(); render(); } };
    f.querySelector("#f-down").onclick = () => { commit(); const { arr } = find(n.id); const i = arr.indexOf(n); if (i < arr.length - 1) { arr.splice(i, 1); arr.splice(i + 1, 0, n); markDirty(); render(); } };
    const od = f.querySelector("#f-outdent");
    if (od) od.onclick = () => { commit(); const { p, arr } = find(n.id); if (!p) return; const gp = find(p.id); arr.splice(arr.indexOf(n), 1); gp.arr.splice(gp.arr.indexOf(p) + 1, 0, n); markDirty(); render(); };
    f.querySelector("#f-del").onclick = () => { if (confirmDelete !== n.id) { confirmDelete = n.id; render(); return; } const { arr } = find(n.id); arr.splice(arr.indexOf(n), 1); openForm = null; confirmDelete = null; markDirty(); render(); };
    f.querySelector("#f-close").onclick = () => { commit(); openForm = null; confirmDelete = null; render(); };
    return f;
  }
  function blank() { return { id: uid(), text: "新節點", status: "todo", link: "", note: "", children: [] }; }
  function focusLabel() { requestAnimationFrame(() => { const form = host.querySelector(".form"); const lab = form && form.parentElement.querySelector(".label"); if (lab) { lab.focus(); document.getSelection()?.selectAllChildren(lab); } }); }

  // ---------- persistence ----------
  function markDirty() { dirty = true; saveEl.textContent = "未儲存…"; saveEl.className = "save dirty"; clearTimeout(saveTimer); saveTimer = setTimeout(save, 900); }
  async function save() {
    if (!dirty || saving) return;
    if (!docRef) { saveEl.textContent = "無法儲存（未連線）"; saveEl.className = "save err"; return; }
    saving = true; saveEl.textContent = "儲存中…"; saveEl.className = "save";
    const body = { ...tree, version: (tree.version || 0) + 1, updatedAt: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"), updatedBy: "boss" };
    try {
      await docRef.set(body);
      tree.version = body.version; tree.updatedAt = body.updatedAt; tree.updatedBy = "boss"; lastSavedAt = body.updatedAt;
      dirty = false; saveEl.textContent = "已儲存"; saveEl.className = "save";
      $("syncInfo").textContent = `最後更新：${body.updatedAt.replace("T", " ").replace("Z", " UTC")}（老闆）・版本 ${body.version}`;
    } catch (e) {
      saveEl.className = "save err";
      if (e && e.code === "invalid_argument") { canWrite = false; saveEl.textContent = "唯讀：此帳號不能編輯"; render(); }
      else if (e && e.code === "quota_exceeded") saveEl.textContent = "儲存失敗：資料庫已滿";
      else { saveEl.textContent = "儲存失敗，稍後重試"; dirty = true; setTimeout(() => { saving = false; save(); }, 1500 + Math.random() * 1500); return; }
    }
    saving = false;
    if (dirty) save();
  }

  async function connect() {
    db = await window.claude?.use?.("db").catch(() => null) ?? null;
    if (!db) { $("emptyMsg").textContent = "這個檢視無法連到資料庫（需要登入並有權限）。"; saveEl.textContent = "離線"; return; }
    const user = await window.claude.use("user").catch(() => null);
    if (user) { const w = await user.can("data.write").catch(() => null); if (w === false) canWrite = false; }
    docRef = db.doc(DOC_PATH);
    let timer = setTimeout(() => { if (!tree) $("emptyMsg").textContent = "還連不上資料庫，再等一下…"; }, 10000);
    docRef.onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      if (snap.metadata.hasPendingWrites) return;
      if (!snap.exists) { if (!tree) { tree = { title: "AI 參謀長 RTS（代號 CHIEF）", nodes: [], version: 0, updatedAt: "", updatedBy: "", instructions: "" }; $("emptyMsg").textContent = "資料庫是空的。等 Claude 寫入，或按「＋ 主節點」開始。"; saveEl.textContent = canWrite === false ? "唯讀" : "就緒"; render(); } return; }
      const d = snap.data();
      if (dirty && d.updatedAt !== lastSavedAt) { host.insertAdjacentHTML("afterbegin", '<div class="banner">資料庫有新版本（可能是 Claude 剛同步）。你尚未儲存的修改儲存後會覆蓋它。</div>'); return; }
      if (dirty) return;
      tree = structuredClone(d); tree.nodes ||= []; lastSavedAt = d.updatedAt || "";
      saveEl.textContent = canWrite === false ? "唯讀" : "已同步"; saveEl.className = "save";
      render();
    }, err => { clearTimeout(timer); saveEl.textContent = err.code === "revoked" ? "連線已中止" : "資料庫錯誤"; saveEl.className = "save err"; });
  }

  // ---------- toolbar ----------
  $("expandAll").onclick = () => { collapsed.clear(); storeCollapsed(); render(); };
  $("collapseAll").onclick = () => { walk(tree?.nodes || [], n => { if ((n.children || []).length) collapsed.add(n.id); }); storeCollapsed(); render(); };
  $("addTop").onclick = () => { if (!tree || canWrite === false) return; const c = blank(); c.text = "新主節點"; tree.nodes.push(c); openForm = c.id; markDirty(); render(); focusLabel(c.id); };
  $("copyMd").onclick = async () => { if (!tree) return; const md = toMarkdown(); try { await navigator.clipboard.writeText(md); $("copyMd").textContent = "已複製"; } catch { const ta = document.createElement("textarea"); ta.value = md; document.body.appendChild(ta); ta.select(); $("copyMd").textContent = "請手動複製（已選取）"; setTimeout(() => ta.remove(), 8000); } setTimeout(() => $("copyMd").textContent = "複製 Markdown", 2000); };
  $("search").oninput = (e) => { query = e.target.value.trim(); render(); };
  let instrTimer = null;
  $("instructions").oninput = (e) => { if (!tree || canWrite === false) return; tree.instructions = e.target.value; clearTimeout(instrTimer); instrTimer = setTimeout(markDirty, 300); };

  connect();
})();
</script>
